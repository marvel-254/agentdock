version: '3.8'

services:
  agentdock:
    image: ghcr.io/marvel-254/agentdock:latest
    container_name: agentdock
    restart: unless-stopped
    ports:
      - "${AGENTDOCK_PORT:-8080}:8080"
    volumes:
      - agentdock-data:/data
    environment:
      - TZ=${TZ:-UTC}
      - NTFY_ENABLED=${NTFY_ENABLED:-0}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-agentdock-alerts}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_PRIORITY_DONE=${NTFY_PRIORITY_DONE:-default}
      - NTFY_PRIORITY_BLOCKED=${NTFY_PRIORITY_BLOCKED:-high}
      - NTFY_PRIORITY_WORKING=${NTFY_PRIORITY_WORKING:-low}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  agentdock-data:
