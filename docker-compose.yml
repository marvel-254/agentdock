version: '3.8'

services:
  orionos:
    image: ghcr.io/marvel-254/orionos:latest
    container_name: orionos
    restart: unless-stopped
    ports:
      - "${ORIONOS_PORT:-8080}:8080"
    volumes:
      - orionos-data:/data
      - /proc:/host/proc:ro
    environment:
      - TZ=${TZ:-UTC}
      - HOST_PROC=/host/proc
      - NTFY_ENABLED=${NTFY_ENABLED:-0}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-orionos-alerts}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_PRIORITY_DONE=${NTFY_PRIORITY_DONE:-default}
      - NTFY_PRIORITY_BLOCKED=${NTFY_PRIORITY_BLOCKED:-high}
      - NTFY_PRIORITY_WORKING=${NTFY_PRIORITY_WORKING:-low}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  orionos-data:
